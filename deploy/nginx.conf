# ==============================================================================
# Website Creator OS V2 — nginx, the public entry point on port 80 (HTTP).
#
#   :80  nginx ── /api/db/*        ──► PostgREST on 127.0.0.1:3001 (the app's data API; /api/db is stripped)
#              ├─ /api/flow/<name> ──► the flow's Pucho Studio webhook (+ X-Inbound-Token, X-App-Url)
#              ├─ /api/inbound/*   ──► PostgREST, only with Authorization: Bearer INBOUND_TOKEN (flow write-back)
#              ├─ /health          ──► 200 "ok" (container liveness); /health/api: start-up status
#              └─ everything else  ──► the React app in /usr/share/nginx/html (SPA fallback)
#
# /api/flow/* and /api/inbound/* are generated at start-up from the container environment into
# /etc/nginx/wco-flows.conf (docker-entrypoint.sh); the 503 answers below apply until they are.
# ==============================================================================

# Keep the original scheme when a TLS proxy (Dokploy/Traefik, a load balancer) is in front.
map $http_x_forwarded_proto $wco_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    # The platform's PORT when it is another port (written by docker-entrypoint.sh; absent otherwise)
    include /etc/nginx/wco-listen*.conf;
    server_name _;
    server_tokens off;

    # Client records carry uploaded logos and photos as base64 inside the JSON body
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Data API start-up status and its last messages (database host, user and password masked),
    # written by /docker-entrypoint.d/40-wco-data-api.sh — for diagnosing without the platform logs.
    location = /health/api {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        alias /tmp/wco-data-api.log;
    }

    # app_settings holds the inbound token; neither the app nor the flows read it. With the wco_web
    # role the database refuses it (schema.sql); on a managed database the API runs as DB_USER,
    # so it is refused here as well.
    location ~* ^/api/db/+app_settings {
        return 404;
    }

    location /api/db/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wco_forwarded_proto;
        proxy_read_timeout 60s;
        error_page 502 504 = @wco_api_down;
    }

    location @wco_api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"The data API is not running yet. See /health/api for the reason."}';
    }

    # Flow endpoints and the flows' write-back door: generated at start-up (exact / regex locations
    # there take precedence over these prefixes, which only answer while they are not configured)
    include /etc/nginx/wco-flows*.conf;

    location /api/flow/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"This flow is not configured on the server. See /health/api for the reason."}';
    }

    location /api/inbound/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Inbound write-back is closed: INBOUND_TOKEN is not set on the server."}';
    }

    location @wco_flow_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"message":"The flow webhook could not be reached or did not answer in time."}';
    }

    # Hashed build files never change, so browsers may keep them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
